name: Publish Store

on:
  push:
    branches: [main]
    paths: ["specs/**", "profiles/**", "schema/**", "scripts/**", "site/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/validate.py
      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          python scripts/build_index.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
